<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="hwilson.dev — Full Stack Developer blog and portfolio"
    />
    <title>hwilson.dev</title>
    <!-- <script type="module" crossorigin src="./assets/index-DPkRwoni.js"></script> -->
    <link rel="stylesheet" crossorigin href="./index.css" />
    <link rel="prefetch" href="./routes/home.html" />
    <link rel="prefetch" href="./routes/articles/index.html" />
  </head>
  <body>
    <main id="root"></main>

    <script id="root-script">
      // Deployed under /blog on GitHub Pages, or at the site root
      const BASE_PATH = window.location.pathname.startsWith("/blog")
        ? "/blog"
        : ""
      const routeMap = {
        "/": "./routes/home.html",
        "/articles": "./routes/articles/index.html",
      }

      // "/blog/articles/" -> "/articles", "/blog/" -> "/"
      const normalizePath = (path) => {
        const stripped = path.replace(BASE_PATH, "").replace(/\/+$/, "")
        return stripped === "" ? "/" : stripped
      }

      const injectRouteContent = (routeText) => {
        const parser = new DOMParser()
        const parsedDom = parser.parseFromString(routeText, "text/html")
        const routeScript = parsedDom.querySelector("script")
        const routeMain = parsedDom.querySelector("main")

        document.querySelector("main#root").innerHTML = routeText

        if (routeScript) {
          const newScriptElement = document.createElement("script")
          newScriptElement.innerHTML = routeScript.innerHTML
          const replaceableScript = document.getElementById("replaceable-script")
          replaceableScript.parentNode.replaceChild(
            newScriptElement,
            replaceableScript
          )
          newScriptElement.id = "replaceable-script"
        }
      }

      const fetchAndLoadContent = (path) => {
        fetch(path).then((resp) =>
          resp.text().then((pathContent) => injectRouteContent(pathContent))
        )
      }

      const showNotFound = () => {
        document.querySelector("main#root").innerHTML = `
          <section class="not-found">
            <h1>404 &mdash; Page Not Found</h1>
            <p><a href="${BASE_PATH}/">Click here to go back home</a></p>
          </section>`
      }

      const loadRoute = () => {
        const target = normalizePath(window.location.pathname)
        if (routeMap[target]) {
          fetchAndLoadContent(routeMap[target])
        } else {
          showNotFound()
        }
      }

      // Covers: initial load, the 404.html bounce, back/forward,
      // and link clicks (route scripts pushState, then dispatch popstate)
      window.addEventListener("popstate", loadRoute)

      // Arrived via 404.html? Restore the clean URL, then load the route.
      const bouncedPath = new URLSearchParams(window.location.search).get("p")
      if (bouncedPath) {
        history.replaceState({}, "", BASE_PATH + normalizePath(bouncedPath))
      }
      loadRoute()
    </script>

    <script id="replaceable-script">
      console.log("ghello")
    </script>
  </body>
</html>
