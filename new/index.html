<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="hwilson.dev — Full Stack Developer blog and portfolio"
    />
    <title>hwilson.dev</title>
    <link rel="stylesheet" crossorigin href="./index.css" />
    <link rel="prefetch" href="./routes/home.html" />
    <link rel="prefetch" href="./routes/articles/index.html" />
  </head>
  <body>
    <main id="root"></main>

    <script id="root-script">
      // Deployed under /blog on GitHub Pages, or at the site root
      const BASE_PATH = window.location.pathname.startsWith("/blog")
        ? "/blog"
        : ""

      // The shell's own address — route fetches always resolve against
      // THIS, so they stay correct no matter what path we've pushed since
      const SHELL_URL = new URL(window.location.href)

      const routeMap = {
        "/": "./routes/home.html",
        "/articles": "./routes/articles/index.html",
      }

      // Pattern fallback: any other path is assumed to be a real file,
      // e.g. /articles/some-article -> /routes/articles/some-article.html.
      // New articles need no router changes — just drop the file in.
      const routeFileFor = (target) => {
        return routeMap[target] || "./routes" + target + ".html"
      }

      // "/blog/articles/" -> "/articles", "/blog/" -> "/"
      const normalizePath = (path) => {
        const stripped = path.replace(BASE_PATH, "").replace(/\/+$/, "")
        return stripped === "" ? "/" : stripped
      }

      const rootEl = () => document.querySelector("main#root")

      const showNotFound = () => {
        rootEl().innerHTML = `
          <section class="not-found">
            <h1>404 &mdash; Page Not Found</h1>
            <p><a href="${BASE_PATH}/">Click here to go back home</a></p>
          </section>`
      }

      const loadRoute = () => {
        const target = normalizePath(window.location.pathname)
        const file = new URL(routeFileFor(target), SHELL_URL).href
        fetch(file).then((resp) => {
          if (!resp.ok) {
            showNotFound()
            return
          }
          resp.text().then((html) => {
            rootEl().innerHTML = html
          })
        })
      }

      // One delegated listener handles every internal link in every
      // route — route files carry no JavaScript of their own
      document.addEventListener("click", (ev) => {
        const el = ev.target instanceof Element ? ev.target : null
        const link = el ? el.closest("a") : null
        if (!link) return
        const rawHref = link.getAttribute("href")
        if (!rawHref) return

        // Resolve explicitly against the current URL
        const url = new URL(rawHref, window.location.href)
        if (url.origin !== window.location.origin) return // external links behave normally

        ev.preventDefault()
        history.pushState({}, "", url.pathname + url.search)
        loadRoute()
      })

      // Back/forward buttons
      window.addEventListener("popstate", loadRoute)

      // Arrived via 404.html? Restore the clean URL, then load the route.
      // Directory routes keep a trailing slash so relative links inside
      // them resolve correctly (e.g. /articles/ + "some-article")
      const bouncedPath = new URLSearchParams(window.location.search).get("p")
      if (bouncedPath) {
        const clean = normalizePath(bouncedPath)
        const restored = routeMap[clean] && clean !== "/" ? clean + "/" : clean
        history.replaceState({}, "", BASE_PATH + restored)
      }
      loadRoute()
    </script>
  </body>
</html>
